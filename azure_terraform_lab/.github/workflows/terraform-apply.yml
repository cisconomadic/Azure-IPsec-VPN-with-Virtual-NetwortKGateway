name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  terraform-apply:
    name: Terraform Apply to Azure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./azure_terraform_lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform init -input=false

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply (Auto-Approve)
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: terraform apply -auto-approve tfplan

      - name: Show Outputs
        run: terraform output

      # 🧱 Generate the FortiGate config output file (if your null_resource hasn't already done it)
      - name: Export FortiGate Config
        if: always()
        run: |
          echo "------------------------------------------------------"
          echo " Exporting FortiGate configuration from Terraform output"
          echo "------------------------------------------------------"
          terraform output -raw vpn_summary > fortigate_config.txt || echo "No vpn_summary output found"
          echo "FortiGate configuration (CLI commands) exported to fortigate_config.txt"
          ls -la fortigate_config.txt || true

      # 📤 Upload FortiGate configuration as an artifact
      - name: Upload FortiGate Config Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortigate-config
          path: |
            fortigate_config.txt
            templates/fortigate_config.tpl
